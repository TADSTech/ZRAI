[package]
name = "zrai-core"
version = "0.1.0"
edition = "2021"
description = "ZRAI proxy core: zero-retention AI privacy sidecar (Rust hot path)."

[lib]
name = "zrai_core"
path = "src/lib.rs"

[[bin]]
name = "zrai"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
